<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 정산판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F4F1;--card:#FFFFFF;--fg:#1B221E;--muted:#69736D;--line:#DCE2DC;
  --accent:#1F6F54;--accent-soft:#E0F0E8;--due:#BF4D2C;--due-soft:#FBE8E1;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131816;--card:#1C2320;--fg:#E7ECE8;--muted:#9AA59E;--line:#2D3732;
  --accent:#5FC39B;--accent-soft:#1D3A2E;--due:#F08A6A;--due-soft:#3B231B;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 56px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.1}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head .actions{flex-wrap:nowrap}
.toast{font-size:13px;color:var(--accent);min-height:1.2em}
.toast.err{color:var(--due)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.danger{color:var(--due);border-color:var(--due)}
.small{padding:5px 10px;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:99px;padding:7px 14px;font-size:14px;white-space:nowrap}
.tab.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.tab.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tab.done.on{background:var(--accent);color:var(--card)}
.tab small{opacity:.75;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.done{border-color:var(--accent)}
.title{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;margin:0;word-break:keep-all}
.meta{color:var(--muted);font-size:13px}
.meta.done{color:var(--accent);font-weight:700}
.host{display:inline-block;font-size:13px;font-weight:700;background:var(--bg);border-radius:6px;padding:2px 8px;margin-top:4px}
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.sum b{font-size:26px;font-variant-numeric:tabular-nums}
.sum .of{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.counts{display:flex;gap:12px;font-size:13px}
.counts .ok{color:var(--accent);font-weight:700}.counts .no{color:var(--due);font-weight:700}
.acct{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.acct span{flex:1;min-width:0;word-break:break-all}
.lockbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:10px;padding:10px}
.lockbox input{width:110px;letter-spacing:.3em;text-align:center}
.unlocked{font-size:13px;color:var(--accent);font-weight:700}
.pin-err{flex-basis:100%;margin:0;font-size:13px;color:var(--due);font-weight:700}
.pin-err:empty{display:none}
.lockbox input.bad{border-color:var(--due)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{flex:1;min-width:0;font-weight:500;word-break:break-all}
.who-in{flex:1;min-width:0;font-weight:500;padding:6px 8px}
.ocr{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.ocr-list{display:flex;flex-direction:column;gap:6px}
.ocr-item{display:flex;align-items:center;gap:8px}
.ocr-item input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.ocr-item input[type=text]{padding:6px 8px;background:var(--card)}
.ocr details summary{font-size:12px;color:var(--muted);cursor:pointer}
.amt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.amt-in{width:92px;text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums}
.chk{flex:none;min-width:84px;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;border:1.5px solid var(--due);background:var(--due-soft);color:var(--due)}
.chk.paid{border-color:var(--accent);background:var(--accent);color:var(--card)}
.tag{flex:none;min-width:84px;text-align:center;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700;background:var(--due-soft);color:var(--due)}
.tag.paid{background:var(--accent-soft);color:var(--accent)}
.x{padding:4px 8px;color:var(--muted);border-color:transparent;background:transparent}
.diff{font-size:13px;color:var(--due)}
.addp{display:flex;gap:8px}
.addp input{flex:1;min-width:0}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:0}
pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:var(--body);font-size:14px;background:var(--bg);border-radius:10px;padding:12px}
.note{font-size:12px;color:var(--muted);margin:0}
.req{color:var(--due);font-weight:700}
.splitbox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.splitbox.warn{background:var(--due-soft)}
.splitbox p{margin:0;font-size:13px;min-width:0;flex:1 1 160px}
.splitbox.warn p{color:var(--due)}
.opt-tag{color:var(--muted);font-weight:400}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.confirm{color:var(--due);font-size:14px}
@media (max-width:400px){.row2{grid-template-columns:1fr}.amt-in{width:80px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<script>
(function(){
  var events=[], sel=null, mode='', pins={}, lockOpen=false, pinOpen=false, delP=null, delEv=false, timer=null, toastT=null, loaded=false, saving=false;
  var app=document.getElementById('app');
  var won=function(n){return (Number(n)||0).toLocaleString('ko-KR')+'원'};
  var num=function(v){return Number(String(v==null?'':v).replace(/[^\d]/g,''))||0};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var md=function(d){if(!d)return'';var p=d.split('-');return (+p[1])+'/'+(+p[2])};
  var split=function(t,n){return n?Math.ceil(t/n/100)*100:0};
  var sorted=function(){return events.map(function(e,i){return{e:e,i:i}}).sort(function(a,b){return (b.e.date||'').localeCompare(a.e.date||'')||b.i-a.i}).map(function(x){return x.e})};
  var cur=function(){return events.filter(function(e){return e.id===sel})[0]};
  function stats(e){var s={paid:0,got:0,sum:0,n:e.people.length};e.people.forEach(function(p){s.sum+=p.a;if(p.p){s.paid++;s.got+=p.a}});s.done=s.n>0&&s.paid===s.n;return s}
  var API='https://script.google.com/macros/s/AKfycbzM4rpKVh8tmzOPHg2aD3J4BQoTjuROuD8pmm9tNHSfYf07tkHmNZQLtasrLV1MdjKlPA/exec';
  function unwrap(r){return r.json().then(function(j){if(j.error)throw new Error(j.error);return j.result})}
  function run(fn){var args=[].slice.call(arguments,1);
    if(fn==='listEvents')return fetch(API+'?api=list').then(unwrap);
    return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(unwrap).catch(function(e){if(e instanceof TypeError)throw new Error('인터넷 연결을 확인해 주세요.');throw e});}
  function saveLocal(){try{localStorage.setItem('jeongsan_cache',JSON.stringify(events))}catch(_){}}
  function errMsg(e){return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,'').replace(/^Error:\s*/,'')}

  function render(){
    if(!cur()){var f=sorted()[0];sel=f?f.id:null}
    var e=cur();
    var h='<div class="head"><h1>모임 정산판</h1><div class="actions"><button class="small ghost" data-a="reload">새로고침</button>'+(mode!=='new'?'<button class="primary small" data-a="new">+ 새 정산</button>':'')+'</div></div>';
    h+='<div class="toast" id="toast" role="status"></div>';
    if(events.length>1)h+='<div class="tabs">'+sorted().map(function(x){var s=stats(x);return '<button class="tab'+(s.done?' done':'')+(x.id===sel?' on':'')+'" data-tab="'+x.id+'">'+(s.done?'✓ ':'')+esc(x.title)+'<small>'+(s.done?'완료':s.paid+'/'+s.n)+'</small></button>'}).join('')+'</div>';
    if(mode==='new'||mode==='edit')h+=form(mode==='edit'?e:null);
    if(!loaded)h+='<div class="empty">불러오는 중…</div>';
    else if(!e&&mode!=='new')h+='<div class="empty">아직 등록된 정산이 없어요.<br>‘+ 새 정산’으로 시작하세요.</div>';
    if(e&&mode!=='new')h+=detail(e);
    app.innerHTML=h;
    if(loaded)saveLocal();
  }
  function detail(e){
    var s=stats(e), total=e.total||s.sum, pct=total?Math.min(100,s.got/total*100):0, can=!!pins[e.id];
    var h='<section class="card'+(s.done?' done':'')+'"><div><h2 class="title">'+esc(e.title)+'</h2>'+
      '<div class="meta'+(s.done?' done':'')+'">'+[e.date?md(e.date)+' 모임':'',s.done?'✓ 정산 완료':(e.due?'입금 마감 '+md(e.due):'')].filter(Boolean).join(' · ')+'</div>'+
      (e.host?'<span class="host">주최 '+esc(e.host)+'</span>':'')+'</div>'+
      '<div class="sum"><div><div class="meta">모인 금액</div><b>'+won(s.got)+'</b></div><div class="of">총 '+won(total)+'</div></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="counts"><span class="ok">입금 '+s.paid+'명</span><span class="no">미입금 '+(s.n-s.paid)+'명</span></div>';
    if(e.account)h+='<div class="acct"><span>'+esc(e.account)+'</span><button class="small" data-a="acct">복사</button></div>';
    if(e.memo)h+='<p class="note">'+esc(e.memo)+'</p>';
    if(can){
      h+='<div class="actions"><span class="unlocked">🔓 벙장 모드</span><button class="small" data-a="edit">정보 수정</button>'+
        (delEv?'<span class="confirm">삭제할까요?</span><button class="small danger" data-a="delok">삭제</button><button class="small ghost" data-a="delno">취소</button>':'<button class="small ghost" data-a="del">정산 삭제</button>')+
        '<button class="small ghost" data-a="pinopen">비밀번호 변경</button><button class="small ghost" data-a="lock">잠그기</button></div>'+
        (pinOpen?'<div class="lockbox"><input id="newpin" type="password" inputmode="numeric" maxlength="4" placeholder="새 4자리" aria-label="새 비밀번호"><button class="small primary" data-a="pinsave">변경</button><button class="small ghost" data-a="pinclose">취소</button><p class="pin-err" id="newpin-err" role="alert"></p></div>':'');
    }else if(lockOpen){
      h+='<div class="lockbox"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" aria-label="벙장 비밀번호"><button class="small primary" data-a="unlock">확인</button><button class="small ghost" data-a="lockclose">취소</button><p class="pin-err" id="pin-err" role="alert"></p></div>';
    }else{
      h+='<div class="actions"><button class="small" data-a="lockopen">🔒 벙장 메뉴 (입금 체크)</button></div>';
    }
    h+='</section><section class="card"><h3 class="sec">참석자별 금액'+(can?' · 버튼을 누르면 입금 체크':'')+'</h3>';
    if(can){var per=split(e.total,s.n),off=e.total&&s.sum!==e.total;
      if(!e.total)h+='<div class="splitbox"><p>총액을 넣으면 인원수대로 자동으로 나눠드려요.</p><button class="small primary" data-a="edit">총액 입력하기</button></div>';
      else h+='<div class="splitbox'+(off?' warn':'')+'"><p>'+(off?'사람별 합계 '+won(s.sum)+'이 총액 '+won(e.total)+'과 달라요.':'총 '+won(e.total)+' ÷ '+s.n+'명')+'</p><button class="small primary" data-a="even">1인당 '+won(per)+'으로 똑같이 나누기</button></div>'}
    h+='<div class="list">';
    e.people.forEach(function(p,i){
      h+='<div class="row">'+(can?'<input class="who-in" data-name="'+i+'" maxlength="30" value="'+esc(p.n)+'" aria-label="참석자 이름">':'<span class="who">'+esc(p.n)+'</span>');
      if(can){
        h+='<input class="amt-in" data-amt="'+i+'" inputmode="numeric" value="'+p.a.toLocaleString('ko-KR')+'" aria-label="'+esc(p.n)+' 금액">'+
          '<button class="chk'+(p.p?' paid':'')+'" data-tog="'+i+'" aria-pressed="'+p.p+'">'+(p.p?'✓ 입금완료':'미입금')+'</button>'+
          (delP===i?'<button class="small danger" data-delpok="'+i+'">빼기</button>':'<button class="x" data-delp="'+i+'" aria-label="'+esc(p.n)+' 빼기">✕</button>');
      }else{
        h+='<span class="amt">'+won(p.a)+'</span><span class="tag'+(p.p?' paid':'')+'">'+(p.p?'✓ 입금완료':'미입금')+'</span>';
      }
      h+='</div>';
    });
    h+='</div>';
    if(can)h+='<div class="addp"><input id="newp" placeholder="참석자 추가 (이름)"><button class="small" data-a="addp">추가</button></div>'+
      '';
    h+='</section>';
    return h;
  }
  function notice(e){
    var un=e.people.filter(function(p){return!p.p});
    var t='[정산] '+e.title+(e.date?' ('+md(e.date)+')':'');
    if(e.host)t+='\n주최: '+e.host;
    if(e.account)t+='\n계좌: '+e.account;
    if(e.due)t+='\n마감: '+md(e.due)+'까지';
    if(!un.length)return t+'\n\n모두 입금 완료! 감사합니다 😊';
    var same=un.every(function(p){return p.a===un[0].a});
    t+='\n\n아직 입금 전 ('+un.length+'명)';
    un.forEach(function(p){t+='\n'+p.n+(same?'':' '+won(p.a))});
    if(same)t+='\n→ 1인당 '+won(un[0].a);
    return t+'\n\n입금하시면 댓글로 남겨주세요 🙏';
  }
  function form(e){
    var v=function(k){return e?esc(e[k]||''):''};
    return '<form class="card" id="f"><h2 class="title">'+(e?'정보 수정':'새 정산')+'</h2>'+
      '<p class="note"><span class="req">*</span> 표시만 꼭 입력하면 돼요. 나머지는 비워두고 나중에 ‘정보 수정’에서 채워도 돼요.</p>'+
      '<label><span>모임 이름 <span class="req">*</span></span><input id="f-title" required maxlength="60" value="'+v('title')+'" placeholder="예: 10/18 한강 피크닉"></label>'+
      '<label><span>주최자 <span class="req">*</span></span><input id="f-host" required maxlength="30" value="'+v('host')+'" placeholder="벙 연 사람 (입금받는 사람)"></label>'+
      '<div class="row2"><label><span>모임 날짜 <span class="req">*</span></span><input id="f-date" type="date" required value="'+v('date')+'"></label><label><span>입금 마감 <span class="opt-tag">(선택)</span></span><input id="f-due" type="date" value="'+v('due')+'"></label></div>'+
      '<label><span>총 금액 (원) <span class="opt-tag">(선택 · 모임 끝나고 입력해도 돼요)</span></span><input id="f-total" inputmode="numeric" value="'+(e&&e.total?e.total.toLocaleString('ko-KR'):'')+'" placeholder="예: 62,000"></label>'+
      (e?'':'<label><span>참석자 <span class="req">*</span> <span class="opt-tag">(쉼표나 줄바꿈으로 구분)</span></span><textarea id="f-people" required placeholder="예: 구미, 준호, 서연"></textarea></label>'+
      '<div class="ocr"><div class="actions"><button type="button" class="small primary" data-a="ocr">📷 당근 참석자 캡처로 불러오기</button><input type="file" id="ocr-file" accept="image/*" multiple hidden></div><p class="note">참석자 목록 화면을 캡처해서 올리면 이름을 읽어와요. 여러 장도 한 번에 올릴 수 있어요.</p><div id="ocr-out"></div></div><p class="note" id="f-calc">총액을 넣으면 1인당 금액이 자동으로 나뉘고, 만든 뒤 사람별로 고칠 수 있어요. 금액을 모르면 비워두세요.</p>')+
      '<label><span>입금 계좌 <span class="opt-tag">(선택 · 나중에 입력 가능)</span></span><input id="f-acct" maxlength="80" value="'+v('account')+'" placeholder="은행 계좌번호 예금주"></label>'+
      '<label><span>메모 <span class="opt-tag">(선택)</span></span><input id="f-memo" maxlength="200" value="'+v('memo')+'" placeholder="예: 2차 비용은 별도"></label>'+
      (e?'':'<label><span>벙장 비밀번호 <span class="req">*</span> <span class="opt-tag">(숫자 4자리)</span></span><input id="f-pin" type="password" inputmode="numeric" maxlength="4" required placeholder="••••"></label><p class="note">이 비밀번호를 아는 사람만 입금 체크와 수정을 할 수 있어요. 잊어버리면 방장에게 문의하세요.</p>')+
      '<div class="actions"><button class="primary" type="submit" id="f-submit">'+(e?'저장':'만들기')+'</button><button class="ghost" type="button" data-a="cancel">취소</button></div></form>';
  }
  var JUNK=/(모임장|운영진|참여자|참석자|참여|멤버|매너|온도|°|℃|프로필|대화|채팅|나가기|신고|초대|관리|전체|더보기|확인|취소|모집|정원|대기|승인|강퇴|위치|오전|오후|분 전|시간 전|일 전|어제|당근|알림|LTE|5G|명$|^\d|%)/;
  function parseNames(text){
    var seen={},good=[],bad=[],black={},lines=String(text||'').split(/\r?\n/).map(function(s){return s.trim()});
    lines.forEach(function(l,i){if(/참여\s*중|대기\s*중/.test(l)){for(var j=i-1;j>=0&&j>=i-3;j--){if(/[가-힣A-Za-z]/.test(lines[j])){black[lines[j]]=1;break}}}});
    lines.forEach(function(l){
      if(black[l])return;
      l=l.split(/[•·|]/)[0].replace(/\s+/g,' ').trim().replace(/님$/,'').trim();
      if(!/[가-힣A-Za-z]/.test(l))return;
      var tk=l.split(' ');if(tk.length>1&&tk[0]==='나')tk.shift();if(tk.length>1&&/(동|읍|면|리|가)$/.test(tk[tk.length-1]))tk.pop();l=tk.join(' ');
      if(!l||seen[l])return;seen[l]=1;
      (l.length>20||/[()]/.test(l)||JUNK.test(l)?bad:good).push(l);
    });
    return {good:good,bad:bad};
  }
  function shrink(file){
    return new Promise(function(ok,no){
      var r=new FileReader();r.onerror=function(){no(new Error('사진을 읽지 못했어요'))};
      r.onload=function(){var img=new Image();img.onerror=function(){no(new Error('사진 형식을 읽지 못했어요'))};
        img.onload=function(){var k=Math.min(1,1400/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
          var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.9).split(',')[1])};
        img.src=r.result};
      r.readAsDataURL(file);
    });
  }
  function ocrItem(n,on){return '<label class="ocr-item"><input type="checkbox"'+(on?' checked':'')+'><input type="text" value="'+esc(n)+'" maxlength="30"></label>'}
  function runOcr(files){
    var out=document.getElementById('ocr-out');if(!out||!files.length)return;
    out.innerHTML='<p class="note">사진에서 이름을 읽는 중… ('+files.length+'장)</p>';
    var all=[];
    files.reduce(function(p,f){return p.then(function(){return shrink(f)}).then(function(b){return run('ocrImage',b,'image/jpeg')}).then(function(t){all.push(t)})},Promise.resolve())
      .then(function(){
        var r=parseNames(all.join('\n'));
        if(!r.good.length&&!r.bad.length){out.innerHTML='<p class="note">글자를 찾지 못했어요. 참석자 이름이 잘 보이게 캡처해 주세요.</p>';return}
        out.innerHTML='<p class="note">맞는 이름만 체크하세요. 잘못 읽힌 글자는 바로 고칠 수 있어요.</p><div class="ocr-list" id="ocr-good">'+r.good.map(function(n){return ocrItem(n,true)}).join('')+'</div>'+
          (r.bad.length?'<details><summary>이름이 아닌 것 같아 뺀 글자 '+r.bad.length+'개 (필요하면 체크)</summary><div class="ocr-list">'+r.bad.map(function(n){return ocrItem(n,false)}).join('')+'</div></details>':'')+
          '<div class="actions"><button type="button" class="small primary" data-a="ocrapply">체크한 이름 참석자에 넣기</button></div>';
      },function(err){out.innerHTML='<p class="note" style="color:var(--due)">'+esc(errMsg(err))+'</p>'});
  }
  function names(){var el=document.getElementById('f-people');return el?el.value.split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean):[]}
  function toast(m,err){var t=document.getElementById('toast');if(t){t.textContent=m;t.className='toast'+(err?' err':'')}clearTimeout(toastT);toastT=setTimeout(function(){var t=document.getElementById('toast');if(t)t.textContent=''},err?5000:2500)}
  function copy(text,label){
    var ok=function(){toast(label+' 복사했어요')};
    var fb=function(){var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();ok()};
    try{navigator.clipboard.writeText(text).then(ok,fb)}catch(_){fb()}
  }
  function load(msg){
    if(saving||inflight||pendingE){if(msg)toast('저장 중이라 잠시 후 다시 눌러 주세요');return Promise.resolve()}
    return run('listEvents').then(function(list){events=list;loaded=true;saveLocal();render();if(msg)toast(msg)},function(err){loaded=true;render();toast('불러오지 못했어요: '+errMsg(err),true)});
  }
  var seq=0,inflight=false,pendingE=null;
  function save(e){
    seq++;pendingE=e;saving=true;clearTimeout(timer);toast('저장 중…');
    timer=setTimeout(flush,400);
  }
  function flush(){
    if(inflight||!pendingE)return;
    var e=pendingE,mySeq=seq;pendingE=null;inflight=true;
    var data={title:e.title,host:e.host,date:e.date,due:e.due,account:e.account,memo:e.memo,total:e.total,people:e.people};
    run('updateEvent',e.id,pins[e.id],data).then(function(list){
      inflight=false;
      if(mySeq===seq&&!pendingE){saving=false;events=list;render();toast('저장했어요')}else flush();
    },function(err){inflight=false;saving=false;pendingE=null;toast('저장 실패: '+errMsg(err),true);load()});
  }
  app.addEventListener('input',function(ev){
    var id=ev.target.id;
    if(id==='f-total'||id==='f-people'){var t=num((document.getElementById('f-total')||{}).value),n=names().length,o=document.getElementById('f-calc');if(o&&t&&n)o.textContent=n+'명 · 1인당 '+won(split(t,n))+' (100원 단위 올림, 만든 뒤 사람별로 수정 가능)'}
  });
  app.addEventListener('keydown',function(ev){if(ev.target.id==='pin'&&ev.key==='Enter')unlock()});
  app.addEventListener('change',function(ev){
    var t=ev.target,e=cur();
    if(t.id==='ocr-file'){runOcr([].slice.call(t.files||[]));t.value='';return}
    if(t.dataset.amt!=null&&e&&pins[e.id]){e.people[+t.dataset.amt].a=num(t.value);render();save(e)}
    if(t.dataset.name!=null&&e&&pins[e.id]){var nv=t.value.trim();if(!nv){t.value=e.people[+t.dataset.name].n;toast('이름은 비워둘 수 없어요',true);return}e.people[+t.dataset.name].n=nv;render();save(e)}
  });
  app.addEventListener('submit',function(ev){
    ev.preventDefault();
    var g=function(i){var el=document.getElementById(i);return el?el.value.trim():''};
    var btn=document.getElementById('f-submit');
    var total=num(g('f-total'));
    if(mode==='edit'){
      var e=cur();var noAmt=e.people.every(function(p){return!p.a});e.title=g('f-title');e.host=g('f-host');e.date=g('f-date');e.due=g('f-due');e.total=total;if(total&&noAmt){var pp=split(total,e.people.length);e.people.forEach(function(p){p.a=pp})}e.account=g('f-acct');e.memo=g('f-memo');
      mode='';render();save(e);return;
    }
    var ns=names(),pin=g('f-pin');
    if(!g('f-host')||!g('f-date')){toast('주최자와 모임 날짜를 입력해 주세요.',true);return}
    if(!/^\d{4}$/.test(pin)){toast('비밀번호는 숫자 4자리로 정해 주세요.',true);return}
    var per=split(total,ns.length);
    var data={title:g('f-title'),host:g('f-host'),date:g('f-date'),due:g('f-due'),total:total,account:g('f-acct'),memo:g('f-memo'),people:ns.map(function(n){return{n:n,a:per,p:false}})};
    btn.disabled=true;btn.textContent='만드는 중…';
    run('createEvent',data,pin).then(function(r){events=r.events;sel=r.id;pins[r.id]=pin;mode='';render();toast('정산을 만들었어요. 비밀번호를 꼭 기억해 두세요.')},
      function(err){btn.disabled=false;btn.textContent='만들기';toast(errMsg(err),true)});
  });
  function pinErr(inp,box,msg){var el=document.getElementById(inp),b=document.getElementById(box);if(b)b.textContent=msg;if(el){el.classList.add('bad');el.value='';el.focus()}}
  function unlock(){
    var e=cur(),el=document.getElementById('pin'),pin=el?el.value.trim():'';
    if(!/^\d{4,8}$/.test(pin)){pinErr('pin','pin-err','숫자 비밀번호를 입력해 주세요.');return}
    var pe=document.getElementById('pin-err');if(pe)pe.textContent='확인 중…';
    run('verifyPin',e.id,pin).then(function(){pins[e.id]=pin;lockOpen=false;render();toast('벙장 모드가 열렸어요')},function(err){pinErr('pin','pin-err','❌ '+errMsg(err)+' 다시 입력해 주세요.')});
  }
  app.addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;var d=b.dataset,e=cur();
    if(d.tab){sel=d.tab;mode='';delP=null;delEv=false;lockOpen=false;pinOpen=false;render();return}
    if(d.tog!=null){var p=e.people[+d.tog];p.p=!p.p;render();save(e);return}
    if(d.delp!=null){delP=+d.delp;render();return}
    if(d.delpok!=null){e.people.splice(+d.delpok,1);delP=null;render();save(e);return}
    switch(d.a){
      case 'reload':load('최신 상태로 불러왔어요');break;
      case 'ocr':var fi=document.getElementById('ocr-file');if(fi)fi.click();break;
      case 'ocrapply':var ta=document.getElementById('f-people'),have=names(),add=[];[].forEach.call(document.querySelectorAll('#ocr-out .ocr-item'),function(r){var c=r.querySelector('input[type=checkbox]'),v=r.querySelector('input[type=text]').value.trim();if(c.checked&&v&&have.indexOf(v)<0&&add.indexOf(v)<0)add.push(v)});if(!add.length){toast('넣을 이름을 체크해 주세요',true);break}ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+add.join('\n');ta.dispatchEvent(new Event('input',{bubbles:true}));document.getElementById('ocr-out').innerHTML='<p class="note">'+add.length+'명을 참석자에 넣었어요.</p>';break;
      case 'new':mode='new';render();var t=document.getElementById('f-title');if(t)t.focus();break;
      case 'edit':mode='edit';render();break;
      case 'cancel':mode='';render();break;
      case 'acct':copy(e.account,'계좌번호를');break;
      case 'copy':copy(notice(e),'안내문을');break;
      case 'lockopen':lockOpen=true;render();var pi=document.getElementById('pin');if(pi)pi.focus();break;
      case 'lockclose':lockOpen=false;render();break;
      case 'unlock':unlock();break;
      case 'pinopen':pinOpen=true;render();break;
      case 'pinclose':pinOpen=false;render();break;
      case 'pinsave':var np=(document.getElementById('newpin')||{}).value||'';if(!/^\d{4}$/.test(np)){pinErr('newpin','newpin-err','새 비밀번호는 숫자 4자리로 정해 주세요.');break}run('changePin',e.id,pins[e.id],np).then(function(){pins[e.id]=np;pinOpen=false;render();toast('비밀번호를 바꿨어요. 꼭 기억해 두세요.')},function(err){pinErr('newpin','newpin-err','❌ '+errMsg(err))});break;
      case 'lock':delete pins[e.id];delEv=false;render();break;
      case 'del':delEv=true;render();break;
      case 'delno':delEv=false;render();break;
      case 'delok':run('deleteEvent',e.id,pins[e.id]).then(function(list){events=list;sel=null;delEv=false;render();toast('삭제했어요')},function(err){toast(errMsg(err),true)});break;
      case 'addp':var i=document.getElementById('newp'),n=i.value.trim();if(!n)return;e.people.push({n:n,a:e.people.length?e.people[e.people.length-1].a:0,p:false});render();save(e);break;
      case 'even':if(!e.total){toast('먼저 정보 수정에서 총액을 입력해 주세요',true);break}var per=split(e.total,e.people.length);e.people.forEach(function(p){p.a=per});render();save(e);break;
    }
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&loaded&&!mode&&!saving)load()});
  try{var c=JSON.parse(localStorage.getItem('jeongsan_cache')||'null');if(Array.isArray(c)){events=c;loaded=true;render()}}catch(_){}
  load();
})();
</script>
